<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6f8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="仕事用語集">
  <link rel="manifest" href="manifest.json">
  <title>仕事用語集</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #1d1d1f;
      --sub: #6e6e73;
      --line: #e5e5ea;
      --accent: #3b82f6;
      --danger: #d92d20;
      --shadow: 0 8px 24px rgba(0,0,0,.06);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans",
                   "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input, textarea, select { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    .app {
      width: min(760px, 100%);
      margin: 0 auto;
      min-height: 100vh;
      padding: 28px 18px calc(100px + env(safe-area-inset-bottom));
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }
    h1 { margin: 0; font-size: 30px; letter-spacing: -.04em; }
    .count { color: var(--sub); font-size: 14px; margin-top: 5px; }
    .search-wrap { position: relative; margin-bottom: 14px; }
    .search {
      width: 100%;
      border: 0;
      outline: 0;
      background: var(--card);
      border-radius: 16px;
      padding: 15px 16px 15px 46px;
      box-shadow: var(--shadow);
      font-size: 16px;
    }
    .search-icon {
      position: absolute; left: 16px; top: 50%;
      transform: translateY(-50%);
      color: #8e8e93; pointer-events: none;
    }
    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 0 8px;
      scrollbar-width: none;
    }
    .filters::-webkit-scrollbar { display: none; }
    .kana-filters {
      display: grid;
      grid-template-columns: repeat(11, minmax(0, 1fr));
      gap: 4px;
      margin: 2px 0 8px;
      padding: 0;
    }
    .kana-chip {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--sub);
      border-radius: 8px;
      padding: 6px 2px;
      font-size: 13px;
      line-height: 1.2;
      cursor: pointer;
      text-align: center;
    }
    .kana-chip.active {
      color: #fff;
      background: var(--text);
      border-color: var(--text);
    }
    .chip {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--sub);
      border-radius: 999px;
      padding: 8px 13px;
      cursor: pointer;
    }
    .chip.active { color: #fff; background: var(--text); border-color: var(--text); }
    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 20px 4px 10px;
    }
    .section-title h2 { margin: 0; font-size: 18px; }
    .section-title span { color: var(--sub); font-size: 13px; }
    .list { display: grid; gap: 10px; }
    .term-card {
      width: 100%;
      text-align: left;
      border: 0;
      background: var(--card);
      border-radius: 18px;
      padding: 17px 18px;
      box-shadow: var(--shadow);
      cursor: pointer;
    }
    .term-row { display: flex; justify-content: space-between; gap: 14px; }
    .term { font-size: 19px; font-weight: 700; }
    .reading { color: var(--sub); font-size: 13px; margin-top: 4px; }
    .category {
      display: inline-block;
      margin-top: 10px;
      color: var(--accent);
      background: #edf4ff;
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 12px;
    }
    .arrow { color: #c7c7cc; font-size: 25px; align-self: center; }
    .empty {
      background: var(--card);
      border-radius: 18px;
      padding: 36px 20px;
      text-align: center;
      color: var(--sub);
      box-shadow: var(--shadow);
    }
    .fab {
      position: fixed;
      right: 20px;
      bottom: calc(20px + env(safe-area-inset-bottom));
      width: 58px; height: 58px;
      border: 0; border-radius: 50%;
      background: var(--text); color: #fff;
      font-size: 30px; line-height: 1;
      box-shadow: 0 10px 28px rgba(0,0,0,.18);
      cursor: pointer;
      z-index: 10;
    }
    .modal {
      position: fixed; inset: 0;
      display: none;
      background: rgba(0,0,0,.42);
      z-index: 20;
      padding: 18px;
      align-items: flex-end;
      justify-content: center;
    }
    .modal.show { display: flex; }
    .sheet {
      width: min(760px, 100%);
      max-height: 92vh;
      overflow: auto;
      background: var(--card);
      border-radius: 24px 24px 12px 12px;
      padding: 22px 18px calc(22px + env(safe-area-inset-bottom));
    }
    .sheet-head {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px;
    }
    .sheet-head h2 { margin: 0; font-size: 22px; }
    .close {
      border: 0; background: #f0f0f2; width: 38px; height: 38px;
      border-radius: 50%; font-size: 22px; cursor: pointer;
    }
    .field { margin: 13px 0; }
    label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 7px; }
    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 13px;
      outline: none;
      padding: 12px 13px;
      background: #fafafa;
    }
    input:focus, textarea:focus { border-color: #9bbcf7; background: #fff; }
    textarea { min-height: 110px; resize: vertical; }
    .actions { display: grid; gap: 9px; margin-top: 18px; }
    .primary, .secondary, .danger {
      border: 0; border-radius: 13px; padding: 13px;
      cursor: pointer; font-weight: 700;
    }
    .primary { background: var(--text); color: #fff; }
    .secondary { background: #f0f0f2; color: var(--text); }
    .danger { background: #fff0ef; color: var(--danger); }
    .detail p { white-space: pre-wrap; margin: 7px 0 18px; line-height: 1.7; }
    .detail-label { color: var(--sub); font-size: 12px; font-weight: 700; }
    .detail-term { font-size: 29px; font-weight: 800; margin: 2px 0 4px; }
    .detail-reading { color: var(--sub); }
    .date { color: var(--sub); font-size: 12px; }
    @media (min-width: 700px) {
      .app { padding-top: 42px; }
      .modal { align-items: center; }
      .sheet { border-radius: 24px; }
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>仕事用語集</h1>
      <div class="count" id="count"></div>
    </div>
  </header>

  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input id="search" class="search" type="search" placeholder="用語を検索…" autocomplete="off">
  </div>

  <div id="filters" class="filters"></div>
  <div id="kanaFilters" class="kana-filters"></div>

  <div class="section-title">
    <h2>用語一覧</h2>
    <span id="resultCount"></span>
  </div>
  <div id="list" class="list"></div>
</div>

<button class="fab" id="addBtn" aria-label="用語を追加">＋</button>

<div class="modal" id="formModal">
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="formTitle">用語を追加</h2>
      <button class="close" id="formClose">×</button>
    </div>
    <form id="termForm">
      <div class="field">
        <label for="term">用語</label>
        <input id="term" required>
      </div>
      <div class="field">
        <label for="reading">読み方</label>
        <input id="reading">
      </div>
      <div class="field">
        <label for="category">カテゴリ</label>
        <input id="category" placeholder="自由に入力">
      </div>
      <div class="field">
        <label for="understanding">自分なりの理解</label>
        <textarea id="understanding"></textarea>
      </div>
      <div class="field">
        <label for="memo">メモ</label>
        <textarea id="memo"></textarea>
      </div>
      <div class="actions">
        <button class="primary" type="submit">保存する</button>
        <button class="secondary" type="button" id="formCancel">キャンセル</button>
      </div>
    </form>
  </div>
</div>

<div class="modal" id="detailModal">
  <div class="sheet">
    <div class="sheet-head">
      <h2>用語の詳細</h2>
      <button class="close" id="detailClose">×</button>
    </div>
    <div class="detail" id="detail"></div>
    <div class="actions">
      <button class="primary" id="editBtn">編集する</button>
      <button class="danger" id="deleteBtn">削除する</button>
    </div>
  </div>
</div>

<script>
(() => {
  const KEY = "workGlossaryTerms_v1";
  let terms = load();
  let selectedCategory = "すべて";
  let selectedKana = "すべて";
  let editingId = null;
  let viewingId = null;

  const $ = id => document.getElementById(id);

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      const data = raw ? JSON.parse(raw) : [];
      return Array.isArray(data) ? data : [];
    } catch {
      return [];
    }
  }

  function save() {
    localStorage.setItem(KEY, JSON.stringify(terms));
  }

  function escapeHtml(value = "") {
    return String(value).replace(/[&<>"']/g, c => ({
      "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;"
    }[c]));
  }

  function formatDate(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return "";
    return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")}`;
  }

  function renderFilters() {
    const cats = [...new Set(terms.map(t => (t.category || "").trim()).filter(Boolean))]
      .sort((a,b) => a.localeCompare(b, "ja"));
    const all = ["すべて", ...cats];
    $("filters").innerHTML = all.map(cat =>
      `<button class="chip ${cat === selectedCategory ? "active" : ""}" data-category="${escapeHtml(cat)}">${escapeHtml(cat)}</button>`
    ).join("");
    $("filters").querySelectorAll(".chip").forEach(btn => {
      btn.addEventListener("click", () => {
        selectedCategory = btn.dataset.category;
        render();
      });
    });
  }

  function normalizeKana(value = "") {
    return String(value).trim().replace(/[ァ-ヶ]/g, ch =>
      String.fromCharCode(ch.charCodeAt(0) - 0x60)
    );
  }

  function getKanaGroup(reading = "") {
    const ch = normalizeKana(reading).charAt(0);
    if ("あいうえお".includes(ch)) return "あ";
    if ("かきくけこがぎぐげござじずぜぞ".includes(ch)) return "か";
    if ("さしすせそざじずぜぞ".includes(ch)) return "さ";
    if ("たちつてとだぢづでど".includes(ch)) return "た";
    if ("なにぬねの".includes(ch)) return "な";
    if ("はひふへほばびぶべぼぱぴぷぺぽ".includes(ch)) return "は";
    if ("まみむめも".includes(ch)) return "ま";
    if ("やゆよ".includes(ch)) return "や";
    if ("らりるれろ".includes(ch)) return "ら";
    if ("わをん".includes(ch)) return "わ";
    return "";
  }

  function renderKanaFilters() {
    const kanaGroups = ["すべて","あ","か","さ","た","な","は","ま","や","ら","わ"];
    $("kanaFilters").innerHTML = kanaGroups.map(kana =>
      `<button class="kana-chip ${kana === selectedKana ? "active" : ""}" data-kana="${kana}">${kana}</button>`
    ).join("");

    $("kanaFilters").querySelectorAll(".kana-chip").forEach(btn => {
      btn.addEventListener("click", () => {
        selectedKana = btn.dataset.kana;
        render();
      });
    });
  }

  function getFiltered() {
    const q = $("search").value.trim().toLowerCase();
    return terms
      .filter(t => selectedCategory === "すべて" || (t.category || "") === selectedCategory)
      .filter(t => selectedKana === "すべて" || getKanaGroup(t.reading || t.term) === selectedKana)
      .filter(t => !q || [t.term,t.reading,t.category,t.understanding,t.memo]
        .some(v => String(v || "").toLowerCase().includes(q)))
      .sort((a,b) => {
        const ar = String(a.reading || a.term || "");
        const br = String(b.reading || b.term || "");
        return ar.localeCompare(br, "ja", { sensitivity: "base" });
      });
  }

  function render() {
    renderFilters();
    renderKanaFilters();
    const filtered = getFiltered();
    $("count").textContent = `${terms.length}件登録`;
    $("resultCount").textContent = `${filtered.length}件`;

    if (!filtered.length) {
      $("list").innerHTML = `<div class="empty">${terms.length ? "条件に一致する用語がありません。" : "まだ用語が登録されていません。<br>右下の「＋」から追加できます。"}</div>`;
      return;
    }

    $("list").innerHTML = filtered.map(t => `
      <button class="term-card" data-id="${t.id}">
        <div class="term-row">
          <div>
            <div class="term">${escapeHtml(t.term)}</div>
            ${t.reading ? `<div class="reading">${escapeHtml(t.reading)}</div>` : ""}
            ${t.category ? `<span class="category">${escapeHtml(t.category)}</span>` : ""}
          </div>
          <div class="arrow">›</div>
        </div>
      </button>
    `).join("");

    $("list").querySelectorAll(".term-card").forEach(card => {
      card.addEventListener("click", () => openDetail(card.dataset.id));
    });
  }

  function openForm(id = null) {
    editingId = id;
    $("formTitle").textContent = id ? "用語を編集" : "用語を追加";
    const t = id ? terms.find(x => x.id === id) : null;
    $("term").value = t?.term || "";
    $("reading").value = t?.reading || "";
    $("category").value = t?.category || "";
    $("understanding").value = t?.understanding || "";
    $("memo").value = t?.memo || "";
    $("formModal").classList.add("show");
    setTimeout(() => $("term").focus(), 50);
  }

  function closeForm() {
    $("formModal").classList.remove("show");
    editingId = null;
  }

  function openDetail(id) {
    viewingId = id;
    const t = terms.find(x => x.id === id);
    if (!t) return;
    $("detail").innerHTML = `
      <div class="detail-term">${escapeHtml(t.term)}</div>
      ${t.reading ? `<div class="detail-reading">${escapeHtml(t.reading)}</div>` : ""}
      ${t.category ? `<p><span class="detail-label">カテゴリ</span><br>${escapeHtml(t.category)}</p>` : ""}
      ${t.understanding ? `<p><span class="detail-label">自分なりの理解</span><br>${escapeHtml(t.understanding)}</p>` : ""}
      ${t.memo ? `<p><span class="detail-label">メモ</span><br>${escapeHtml(t.memo)}</p>` : ""}
      <div class="date">登録日：${formatDate(t.createdAt)}</div>
    `;
    $("detailModal").classList.add("show");
  }

  function closeDetail() {
    $("detailModal").classList.remove("show");
    viewingId = null;
  }

  $("search").addEventListener("input", render);
  $("addBtn").addEventListener("click", () => openForm());
  $("formClose").addEventListener("click", closeForm);
  $("formCancel").addEventListener("click", closeForm);
  $("detailClose").addEventListener("click", closeDetail);

  $("termForm").addEventListener("submit", e => {
    e.preventDefault();
    const term = $("term").value.trim();
    if (!term) return;

    const payload = {
      term,
      reading: $("reading").value.trim(),
      category: $("category").value.trim(),
      understanding: $("understanding").value.trim(),
      memo: $("memo").value.trim()
    };

    if (editingId) {
      const index = terms.findIndex(t => t.id === editingId);
      if (index >= 0) terms[index] = { ...terms[index], ...payload };
    } else {
      terms.push({
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
        ...payload,
        createdAt: new Date().toISOString()
      });
    }

    save();
    closeForm();
    render();
  });

  $("editBtn").addEventListener("click", () => {
    const id = viewingId;
    closeDetail();
    if (id) openForm(id);
  });

  $("deleteBtn").addEventListener("click", () => {
    const t = terms.find(x => x.id === viewingId);
    if (!t) return;
    if (!confirm(`「${t.term}」を削除しますか？`)) return;
    terms = terms.filter(x => x.id !== viewingId);
    save();
    closeDetail();
    render();
  });

  [$("formModal"), $("detailModal")].forEach(modal => {
    modal.addEventListener("click", e => {
      if (e.target === modal) modal.classList.remove("show");
    });
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }

  render();
})();
</script>
</body>
</html>
