<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6f8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="仕事用語集">
  <link rel="manifest" href="manifest.json">
  <title>仕事用語集</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #1d1d1f;
      --sub: #6e6e73;
      --line: #e5e5ea;
      --accent: #3b82f6;
      --danger: #d92d20;
      --shadow: 0 8px 24px rgba(0,0,0,.06);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans",
                   "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input, textarea, select { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    .app {
      width: min(760px, 100%);
      margin: 0 auto;
      min-height: 100vh;
      padding: 28px 18px calc(100px + env(safe-area-inset-bottom));
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }
    h1 { margin: 0; font-size: 26px; letter-spacing: -.04em; }
    .count { color: var(--sub); font-size: 12px; margin-top: 5px; }
    .search-wrap { position: relative; margin-bottom: 14px; }
    .search {
      width: 100%;
      border: 0;
      outline: 0;
      background: var(--card);
      border-radius: 16px;
      padding: 15px 16px 15px 46px;
      box-shadow: var(--shadow);
      font-size: 16px;
    }
    .search-icon {
      position: absolute; left: 16px; top: 50%;
      transform: translateY(-50%);
      color: #8e8e93; pointer-events: none;
    }
    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 0 8px;
      scrollbar-width: none;
    }
    .filters::-webkit-scrollbar { display: none; }
    .kana-filters {
      display: grid;
      grid-template-columns: repeat(11, minmax(0, 1fr));
      gap: 4px;
      margin: 2px 0 8px;
      padding: 0;
    }
    .kana-chip {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--sub);
      border-radius: 8px;
      padding: 5px 2px;
      font-size: 11px;
      line-height: 1.2;
      cursor: pointer;
      text-align: center;
    }
    .kana-chip.active {
      color: #fff;
      background: var(--text);
      border-color: var(--text);
    }
    .chip {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--sub);
      border-radius: 999px;
      padding: 6px 11px;
      cursor: pointer;
    }
    .chip.active { color: #fff; background: var(--text); border-color: var(--text); }
    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 20px 4px 10px;
    }
    .section-title h2 { margin: 0; font-size: 16px; }
    .section-title span { color: var(--sub); font-size: 11px; }
    .list { display: grid; gap: 10px; }
    .term-card {
      width: 100%;
      text-align: left;
      border: 0;
      background: var(--card);
      border-radius: 18px;
      padding: 12px 14px;
      box-shadow: var(--shadow);
      cursor: pointer;
    }
    .term-row { display: flex; align-items: center; gap: 12px; }
    .term-main { min-width: 0; flex: 1; }
    .term { font-size: 14px; font-weight: 700; }
    .term-subrow {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      column-gap: 8px;
      min-width: 0;
      margin-top: 3px;
    }
    .alias {
      grid-column: 1;
      min-width: 0;
      color: var(--sub);
      font-size: 10px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .category-inline {
      grid-column: 2;
      width: 76px;
      text-align: center;
      color: var(--cat-fg);
      background: var(--cat-bg);
      border-radius: 999px;
      padding: 2px 6px;
      font-size: 9px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      box-sizing: border-box;
    }
    .memo-side {
      flex: 0 0 48%;
      max-width: 48%;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
    }
    .memo-item {
      max-width: 100%;
      width: fit-content;
      color: var(--accent);
      background: #edf4ff;
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 10px;
      box-sizing: border-box;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .term-card.selecting { cursor: pointer; }
    .term-card.selected { outline: 2px solid var(--text); }
    .select-box { width: 22px; height: 22px; flex: 0 0 22px; accent-color: var(--text); }
    .term-card .reading { display: none; }
    .reading { color: var(--sub); font-size: 11px; margin-top: 3px; }
    .category {
      display: inline-block;
      margin-top: 10px;
      color: var(--accent);
      background: #edf4ff;
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 10px;
    }
    .arrow { color: #c7c7cc; font-size: 25px; align-self: center; }
    .list-actions { display: flex; align-items: center; gap: 6px; }
    .select-btn, .bulk-delete-btn, .done-btn { border: 0; border-radius: 999px; padding: 6px 9px; font-size: 11px; cursor: pointer; }
    .select-btn, .done-btn { background: #f0f0f2; color: var(--text); }
    .bulk-delete-btn { background: #fff0ef; color: var(--danger); }
    .bulk-delete-btn:disabled { opacity: .45; cursor: default; }
    .empty {
      background: var(--card);
      border-radius: 18px;
      padding: 36px 20px;
      text-align: center;
      color: var(--sub);
      box-shadow: var(--shadow);
    }
    .fab {
      position: fixed;
      right: 20px;
      bottom: calc(20px + env(safe-area-inset-bottom));
      width: 58px; height: 58px;
      border: 0; border-radius: 50%;
      background: var(--text); color: #fff;
      font-size: 30px; line-height: 1;
      box-shadow: 0 10px 28px rgba(0,0,0,.18);
      cursor: pointer;
      z-index: 10;
    }
    .modal {
      position: fixed; inset: 0;
      display: none;
      background: rgba(0,0,0,.42);
      z-index: 20;
      padding: 18px;
      align-items: flex-end;
      justify-content: center;
    }
    .modal.show { display: flex; }
    .sheet {
      width: min(760px, 100%);
      max-height: 92vh;
      overflow: auto;
      background: var(--card);
      border-radius: 24px 24px 12px 12px;
      padding: 22px 18px calc(22px + env(safe-area-inset-bottom));
    }
    .sheet-head {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px;
    }
    .sheet-head h2 { margin: 0; font-size: 22px; }
    .close {
      border: 0; background: #f0f0f2; width: 38px; height: 38px;
      border-radius: 50%; font-size: 22px; cursor: pointer;
    }
    .field { margin: 13px 0; }
    label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 7px; }
    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 13px;
      outline: none;
      padding: 12px 13px;
      background: #fafafa;
    }
    input:focus, textarea:focus { border-color: #9bbcf7; background: #fff; }
    textarea { min-height: 110px; resize: vertical; }
    .actions { display: grid; gap: 9px; margin-top: 18px; }
    .primary, .secondary, .danger {
      border: 0; border-radius: 13px; padding: 13px;
      cursor: pointer; font-weight: 700;
    }
    .primary { background: var(--text); color: #fff; }
    .secondary { background: #f0f0f2; color: var(--text); }
    .danger { background: #fff0ef; color: var(--danger); }
    .detail p { white-space: pre-wrap; margin: 7px 0 18px; line-height: 1.7; }
    .detail-label { color: var(--sub); font-size: 10px; font-weight: 700; }
    .detail-term { font-size: 29px; font-weight: 800; margin: 2px 0 4px; }
    .detail-alias { color: var(--sub); font-size: 13px; margin-bottom: 3px; }
    .detail-reading { color: var(--sub); }
    .date { color: var(--sub); font-size: 10px; }
    @media (min-width: 700px) {
      .app { padding-top: 42px; }
      .modal { align-items: center; }
      .sheet { border-radius: 24px; }
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>仕事用語集</h1>
      <div class="count" id="count"></div>
    </div>
  </header>

  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input id="search" class="search" type="search" placeholder="用語を検索…" autocomplete="off">
  </div>

  <div id="filters" class="filters"></div>
  <div id="kanaFilters" class="kana-filters"></div>

  <div class="section-title">
    <h2>用語一覧</h2>
    <div class="list-actions">
      <span id="resultCount"></span>
      <button class="select-btn" id="selectModeBtn" type="button">選択</button>
      <button class="bulk-delete-btn" id="bulkDeleteBtn" type="button" disabled>選択削除</button>
      <button class="done-btn" id="doneSelectBtn" type="button" style="display:none">完了</button>
    </div>
  </div>
  <div id="list" class="list"></div>
</div>

<button class="fab" id="addBtn" aria-label="用語を追加">＋</button>

<div class="modal" id="formModal">
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="formTitle">用語を追加</h2>
      <button class="close" id="formClose">×</button>
    </div>
    <form id="termForm">
      <div class="field">
        <label for="term">用語</label>
        <input id="term" required>
      </div>
      <div class="field">
        <label for="reading">読み方</label>
        <input id="reading">
      </div>
      <div class="field">
        <label for="alias">別名</label>
        <input id="alias" placeholder="別名・略称など">
      </div>
      <div class="field">
        <label for="category">カテゴリ</label>
        <input id="category" placeholder="自由に入力">
      </div>
      <div class="field">
        <label for="memo">メモ</label>
        <textarea id="memo" placeholder="1行につき1つのメモを入力"></textarea>
      </div>
      <div class="actions">
        <button class="primary" type="submit">保存する</button>
        <button class="secondary" type="button" id="formCancel">キャンセル</button>
      </div>
    </form>
  </div>
</div>

<div class="modal" id="detailModal">
  <div class="sheet">
    <div class="sheet-head">
      <h2>用語の詳細</h2>
      <button class="close" id="detailClose">×</button>
    </div>
    <div class="detail" id="detail"></div>
    <div class="actions">
      <button class="primary" id="editBtn">編集する</button>
      <button class="danger" id="deleteBtn">削除する</button>
    </div>
  </div>
</div>

<script>
(() => {
  const KEY = "workGlossaryTerms_v1";
  let terms = load();
  let selectedCategories = [];
  let selectedKana = "すべて";
  let editingId = null;
  let viewingId = null;
  let selectMode = false;
  let selectedIds = new Set();

  const $ = id => document.getElementById(id);

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      const data = raw ? JSON.parse(raw) : [];
      return Array.isArray(data)
        ? data.map(({ understanding, ...term }) => term)
        : [];
    } catch {
      return [];
    }
  }

  function save() {
    localStorage.setItem(KEY, JSON.stringify(terms));
  }

  function categoryColors(category) {
    const palette = [
      ["#eee6ff", "#6b35b5"],
      ["#fff0cf", "#8a5a00"],
      ["#e5f7ec", "#18794e"],
      ["#e6f0ff", "#2d63b8"],
      ["#ffe8ed", "#b4234d"],
      ["#e9e9ee", "#4b4b55"],
      ["#e5f7f7", "#16706f"],
      ["#f3e8ff", "#7a3db8"]
    ];
    const key = String(category || "").trim();
    let hash = 0;
    for (let i = 0; i < key.length; i++) {
      hash = (hash * 31 + key.charCodeAt(i)) >>> 0;
    }
    const [bg, fg] = palette[hash % palette.length];
    return `--cat-bg:${bg};--cat-fg:${fg};`;
  }

  function escapeHtml(value = "") {
    return String(value).replace(/[&<>"']/g, c => ({
      "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;"
    }[c]));
  }

  function formatDate(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return "";
    return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")}`;
  }

  function renderFilters() {
    const cats = [...new Set(terms.map(t => (t.category || "").trim()).filter(Boolean))]
      .sort((a,b) => a.localeCompare(b, "ja"));
    const all = ["すべて", ...cats];
    $("filters").innerHTML = all.map(cat =>
      `<button class="chip ${cat === "すべて" ? (selectedCategories.length === 0 ? "active" : "") : (selectedCategories.includes(cat) ? "active" : "")}" data-category="${escapeHtml(cat)}">${escapeHtml(cat)}</button>`
    ).join("");
    $("filters").querySelectorAll(".chip").forEach(btn => {
      btn.addEventListener("click", () => {
        const cat = btn.dataset.category;
        if (cat === "すべて") {
          selectedCategories = [];
        } else if (selectedCategories.includes(cat)) {
          selectedCategories = selectedCategories.filter(c => c !== cat);
        } else {
          selectedCategories = [...selectedCategories, cat];
        }
        render();
      });
    });
  }

  function normalizeKana(value = "") {
    return String(value).trim().replace(/[ァ-ヶ]/g, ch =>
      String.fromCharCode(ch.charCodeAt(0) - 0x60)
    );
  }

  function getKanaGroup(reading = "") {
    const ch = normalizeKana(reading).charAt(0);
    if ("あいうえお".includes(ch)) return "あ";
    if ("かきくけこがぎぐげござじずぜぞ".includes(ch)) return "か";
    if ("さしすせそざじずぜぞ".includes(ch)) return "さ";
    if ("たちつてとだぢづでど".includes(ch)) return "た";
    if ("なにぬねの".includes(ch)) return "な";
    if ("はひふへほばびぶべぼぱぴぷぺぽ".includes(ch)) return "は";
    if ("まみむめも".includes(ch)) return "ま";
    if ("やゆよ".includes(ch)) return "や";
    if ("らりるれろ".includes(ch)) return "ら";
    if ("わをん".includes(ch)) return "わ";
    return "";
  }

  function renderKanaFilters() {
    const kanaGroups = ["すべて","あ","か","さ","た","な","は","ま","や","ら","わ"];
    $("kanaFilters").innerHTML = kanaGroups.map(kana =>
      `<button class="kana-chip ${kana === selectedKana ? "active" : ""}" data-kana="${kana}">${kana}</button>`
    ).join("");

    $("kanaFilters").querySelectorAll(".kana-chip").forEach(btn => {
      btn.addEventListener("click", () => {
        selectedKana = btn.dataset.kana;
        render();
      });
    });
  }

  function getFiltered() {
    const q = $("search").value.trim().toLowerCase();
    return terms
      .filter(t => selectedCategories.length === 0 || selectedCategories.includes((t.category || "").trim()))
      .filter(t => selectedKana === "すべて" || getKanaGroup(t.reading || t.term) === selectedKana)
      .filter(t => !q || [t.term,t.reading,t.alias,t.category,t.memo]
        .some(v => String(v || "").toLowerCase().includes(q)))
      .sort((a,b) => {
        // 絞り込みなしの「すべて」は登録順（新しいものを上）、
        // かな絞り込み時はこれまで通り読み方順。
        if (selectedCategories.length === 0 && selectedKana === "すべて") {
          return String(b.createdAt || "").localeCompare(String(a.createdAt || ""));
        }
        const ar = String(a.reading || a.term || "");
        const br = String(b.reading || b.term || "");
        return ar.localeCompare(br, "ja", { sensitivity: "base" });
      });
  }

  function render() {
    renderFilters();
    renderKanaFilters();
    const filtered = getFiltered();
    $("count").textContent = `${terms.length}件登録`;
    $("resultCount").textContent = `${filtered.length}件`;
    $("selectModeBtn").style.display = selectMode ? "none" : "";
    $("doneSelectBtn").style.display = selectMode ? "" : "none";
    $("bulkDeleteBtn").disabled = selectedIds.size === 0;
    $("bulkDeleteBtn").textContent = selectedIds.size ? `選択削除（${selectedIds.size}）` : "選択削除";

    if (!filtered.length) {
      $("list").innerHTML = `<div class="empty">${terms.length ? "条件に一致する用語がありません。" : "まだ用語が登録されていません。<br>右下の「＋」から追加できます。"}</div>`;
      return;
    }

    $("list").innerHTML = filtered.map(t => `
      <div class="term-card ${selectMode ? "selecting" : ""} ${selectedIds.has(t.id) ? "selected" : ""}" data-id="${t.id}" role="button" tabindex="0">
        <div class="term-row">
          ${selectMode ? `<input class="select-box" type="checkbox" ${selectedIds.has(t.id) ? "checked" : ""} aria-label="${escapeHtml(t.term)}を選択">` : ""}
          <div class="term-main">
            <div class="term">${escapeHtml(t.term)}</div>
            <div class="term-subrow">
              ${t.alias ? `<div class="alias">（${escapeHtml(t.alias)}）</div>` : ""}
              ${t.category ? `<span class="category-inline" style="${categoryColors(t.category)}">${escapeHtml(t.category)}</span>` : ""}
            </div>
          </div>
          ${t.memo ? `<div class="memo-side">${String(t.memo).split(/\r?\n/).filter(Boolean).map(m => `<span class="memo-item">${escapeHtml(m)}</span>`).join("")}</div>` : ""}
          ${!selectMode ? `<div class="arrow">›</div>` : ""}
        </div>
      </div>
    `).join("");

    $("list").querySelectorAll(".term-card").forEach(card => {
      const toggle = () => {
        const id = card.dataset.id;
        if (!selectMode) { openDetail(id); return; }
        if (selectedIds.has(id)) selectedIds.delete(id);
        else selectedIds.add(id);
        render();
      };
      card.addEventListener("click", e => {
        if (e.target.classList.contains("select-box")) return;
        toggle();
      });
      card.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
      });
    });

    $("list").querySelectorAll(".select-box").forEach(box => {
      box.addEventListener("change", e => {
        const id = e.target.closest(".term-card").dataset.id;
        if (e.target.checked) selectedIds.add(id);
        else selectedIds.delete(id);
        render();
      });
    });
  }

  function openForm(id = null) {
    editingId = id;
    $("formTitle").textContent = id ? "用語を編集" : "用語を追加";
    const t = id ? terms.find(x => x.id === id) : null;
    $("term").value = t?.term || "";
    $("reading").value = t?.reading || "";
    $("alias").value = t?.alias || "";
    $("category").value = t?.category || "";
    $("memo").value = t?.memo || "";
    $("formModal").classList.add("show");
    setTimeout(() => $("term").focus(), 50);
  }

  function closeForm() {
    $("formModal").classList.remove("show");
    editingId = null;
  }

  function openDetail(id) {
    viewingId = id;
    const t = terms.find(x => x.id === id);
    if (!t) return;
    $("detail").innerHTML = `
      <div class="detail-term">${escapeHtml(t.term)}</div>
      ${t.alias ? `<div class="detail-alias">（${escapeHtml(t.alias)}）</div>` : ""}
      ${t.reading ? `<div class="detail-reading">${escapeHtml(t.reading)}</div>` : ""}
      ${t.category ? `<p><span class="detail-label">カテゴリ</span><br>${escapeHtml(t.category)}</p>` : ""}
      ${t.memo ? `<p><span class="detail-label">メモ</span><br>${String(t.memo).split(/\r?\n/).filter(Boolean).map(m => escapeHtml(m)).join("<br>")}</p>` : ""}
      <div class="date">登録日：${formatDate(t.createdAt)}</div>
    `;
    $("detailModal").classList.add("show");
  }

  function closeDetail() {
    $("detailModal").classList.remove("show");
    viewingId = null;
  }

  $("search").addEventListener("input", render);
  $("addBtn").addEventListener("click", () => openForm());
  $("formClose").addEventListener("click", closeForm);
  $("formCancel").addEventListener("click", closeForm);
  $("detailClose").addEventListener("click", closeDetail);

  $("termForm").addEventListener("submit", e => {
    e.preventDefault();
    const term = $("term").value.trim();
    if (!term) return;

    const payload = {
      term,
      reading: $("reading").value.trim(),
      alias: $("alias").value.trim(),
      category: $("category").value.trim(),
      memo: $("memo").value.trim()
    };

    if (editingId) {
      const index = terms.findIndex(t => t.id === editingId);
      if (index >= 0) terms[index] = { ...terms[index], ...payload };
    } else {
      terms.push({
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
        ...payload,
        createdAt: new Date().toISOString()
      });
    }

    save();
    closeForm();
    render();
  });

  $("selectModeBtn").addEventListener("click", () => {
    selectMode = true;
    selectedIds.clear();
    render();
  });

  $("doneSelectBtn").addEventListener("click", () => {
    selectMode = false;
    selectedIds.clear();
    render();
  });

  $("bulkDeleteBtn").addEventListener("click", () => {
    if (!selectedIds.size) return;
    const count = selectedIds.size;
    if (!confirm(`${count}件の用語を削除しますか？`)) return;
    terms = terms.filter(t => !selectedIds.has(t.id));
    selectedIds.clear();
    selectMode = false;
    save();
    render();
  });

  $("editBtn").addEventListener("click", () => {
    const id = viewingId;
    closeDetail();
    if (id) openForm(id);
  });

  $("deleteBtn").addEventListener("click", () => {
    const t = terms.find(x => x.id === viewingId);
    if (!t) return;
    if (!confirm(`「${t.term}」を削除しますか？`)) return;
    terms = terms.filter(x => x.id !== viewingId);
    save();
    closeDetail();
    render();
  });

  [$("formModal"), $("detailModal")].forEach(modal => {
    modal.addEventListener("click", e => {
      if (e.target === modal) modal.classList.remove("show");
    });
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }

  render();
})();
</script>
</body>
</html>
