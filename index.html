<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>就職活動管理</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  background: #f5f5f7;
  color: #222;
}

header {
  background: #222;
  color: white;
  padding: 20px;
}

header h1 {
  margin: 0;
  font-size: 23px;
}

header p {
  margin: 6px 0 0;
  font-size: 13px;
  opacity: .8;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 15px 15px 90px;
}

.page {
  display: none;
}

.page.active {
  display: block;
}

.section-title {
  font-size: 19px;
  font-weight: bold;
  margin: 18px 0 10px;
}

.card {
  background: white;
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.stat {
  background: white;
  border-radius: 14px;
  padding: 16px;
}

.stat-label {
  font-size: 12px;
  color: #777;
}

.stat-number {
  font-size: 27px;
  font-weight: bold;
  margin-top: 4px;
}

input,
select,
textarea,
button {
  width: 100%;
  padding: 12px;
  margin-top: 7px;
  margin-bottom: 15px;
  font-size: 16px;
  border-radius: 9px;
}

input,
select,
textarea {
  border: 1px solid #d1d1d6;
  background: white;
}

textarea {
  min-height: 110px;
  resize: vertical;
}

button {
  border: none;
  background: #222;
  color: white;
}

button.secondary {
  background: #e9e9ed;
  color: #222;
}

button.danger {
  background: #d92d20;
}

button.blue {
  background: #2563eb;
}

label {
  font-size: 13px;
  font-weight: bold;
}

.company {
  padding: 16px 4px;
  border-bottom: 1px solid #eee;
  cursor: pointer;
}

.company:last-child {
  border-bottom: none;
}

.company-name {
  font-weight: bold;
  font-size: 17px;
}

.meta {
  font-size: 13px;
  color: #666;
  margin-top: 4px;
}

.status {
  display: inline-block;
  background: #eef2ff;
  color: #333;
  padding: 5px 9px;
  border-radius: 20px;
  font-size: 12px;
  margin-top: 7px;
}

.interview {
  background: #f0f4ff;
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 10px;
}

.interview-company {
  font-size: 17px;
  font-weight: bold;
}

.interview-date {
  font-size: 14px;
  margin-top: 5px;
}

.interview-round {
  font-size: 13px;
  color: #666;
  margin-top: 4px;
}

.web-button {
  display: block;
  text-align: center;
  background: #2563eb;
  color: white;
  text-decoration: none;
  padding: 11px;
  border-radius: 9px;
  margin-top: 10px;
}

.action-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.action-row button {
  margin-bottom: 8px;
}

.back-button {
  background: #e9e9ed;
  color: #222;
}

.detail-title {
  font-size: 24px;
  font-weight: bold;
  margin-bottom: 18px;
}

.detail-row {
  padding: 12px 0;
  border-bottom: 1px solid #eee;
}

.detail-label {
  font-size: 12px;
  color: #777;
}

.detail-value {
  font-size: 16px;
  margin-top: 4px;
  white-space: pre-wrap;
  word-break: break-word;
}

.detail-link {
  color: #2563eb;
  word-break: break-all;
}

.empty {
  color: #777;
  text-align: center;
  padding: 15px;
}

.search-box {
  margin-bottom: 8px;
}

.filter-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 65px;
  background: white;
  border-top: 1px solid #ddd;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  z-index: 100;
}

.bottom-nav button {
  background: white;
  color: #666;
  margin: 0;
  border-radius: 0;
  font-size: 12px;
}

.bottom-nav button.active {
  color: #2563eb;
  font-weight: bold;
}

.small-text {
  font-size: 12px;
  color: #777;
}

hr {
  border: none;
  border-top: 1px solid #eee;
  margin: 18px 0;
}
</style>
</head>

<body>

<header>
  <h1>就職活動管理</h1>
  <p id="todayText"></p>
</header>

<div class="container">


<!-- =====================
     ホーム
===================== -->

<section id="homePage" class="page active">

  <div class="section-title">今日の面接</div>
  <div id="todayInterviews"></div>

  <div class="section-title">今後の面接</div>
  <div id="upcomingInterviews"></div>

  <div class="section-title">選考状況</div>

  <div class="stats">

    <div class="stat">
      <div class="stat-label">応募・書類選考</div>
      <div class="stat-number" id="selectionCount">0</div>
    </div>

    <div class="stat">
      <div class="stat-label">面接中</div>
      <div class="stat-number" id="interviewCount">0</div>
    </div>

    <div class="stat">
      <div class="stat-label">結果待ち</div>
      <div class="stat-number" id="waitingCount">0</div>
    </div>

    <div class="stat">
      <div class="stat-label">内定</div>
      <div class="stat-number" id="offerCount">0</div>
    </div>

  </div>

  <div class="section-title">その他</div>

  <div class="stats">

    <div class="stat">
      <div class="stat-label">不合格</div>
      <div class="stat-number" id="rejectedCount">0</div>
    </div>

    <div class="stat">
      <div class="stat-label">辞退</div>
      <div class="stat-number" id="withdrawnCount">0</div>
    </div>

  </div>

</section>



<!-- =====================
     企業一覧
===================== -->

<section id="companiesPage" class="page">

  <div class="section-title">企業一覧</div>

  <div class="card">

    <input
      id="searchCompany"
      class="search-box"
      type="search"
      placeholder="企業名を検索"
    >

    <div class="filter-row">

      <select id="filterStatus">

        <option value="">すべてのステータス</option>
        <option value="応募">応募</option>
        <option value="書類選考">書類選考</option>
        <option value="一次面接">一次面接</option>
        <option value="二次面接">二次面接</option>
        <option value="最終面接">最終面接</option>
        <option value="面接結果待ち">面接結果待ち</option>
        <option value="内定">内定</option>
        <option value="不合格">不合格</option>
        <option value="辞退">辞退</option>

      </select>

      <button
        class="secondary"
        id="clearFilters">
        リセット
      </button>

    </div>

  </div>


  <div class="card">
    <div id="companyList"></div>
  </div>

</section>



<!-- =====================
     企業詳細
===================== -->

<section id="companyDetailPage" class="page">

  <button
    class="back-button"
    onclick="showPage('companiesPage')">
    ← 企業一覧に戻る
  </button>

  <div class="card">

    <div
      id="detailCompanyName"
      class="detail-title">
    </div>

    <div class="detail-row">
      <div class="detail-label">職種</div>
      <div id="detailJobType" class="detail-value"></div>
    </div>

    <div class="detail-row">
      <div class="detail-label">ステータス</div>
      <div id="detailStatus" class="detail-value"></div>
    </div>

    <div class="detail-row">
      <div class="detail-label">求人媒体</div>
      <div id="detailMedia" class="detail-value"></div>
    </div>

    <div class="detail-row">
      <div class="detail-label">応募日</div>
      <div id="detailAppliedDate" class="detail-value"></div>
    </div>

    <div class="detail-row">
      <div class="detail-label">求人URL</div>
      <div id="detailJobUrl" class="detail-value"></div>
    </div>

    <div class="detail-row">
      <div class="detail-label">メモ</div>
      <div id="detailMemo" class="detail-value"></div>
    </div>

    <hr>

    <div class="action-row">

      <button
        id="editCompanyButton">
        編集
      </button>

      <button
        id="deleteCompanyButton"
        class="danger">
        削除
      </button>

    </div>

    <button
      id="detailAddInterviewButton"
      class="blue">
      ＋この企業の面接を登録
    </button>

  </div>


  <div class="section-title">
    面接履歴・予定
  </div>

  <div id="detailInterviews"></div>

</section>



<!-- =====================
     企業編集
===================== -->

<section id="editCompanyPage" class="page">

  <button
    class="back-button"
    onclick="showPage('companyDetailPage')">
    ← 企業詳細に戻る
  </button>

  <div class="section-title">
    企業情報を編集
  </div>

  <div class="card">

    <label>企業名</label>
    <input id="editCompanyName" type="text">


    <label>職種</label>
    <input id="editJobType" type="text">


    <label>ステータス</label>

    <select id="editStatus">

      <option value="応募">応募</option>
      <option value="書類選考">書類選考</option>
      <option value="一次面接">一次面接</option>
      <option value="二次面接">二次面接</option>
      <option value="最終面接">最終面接</option>
      <option value="面接結果待ち">面接結果待ち</option>
      <option value="内定">内定</option>
      <option value="不合格">不合格</option>
      <option value="辞退">辞退</option>

    </select>


    <label>求人媒体</label>
    <input id="editMedia" type="text">


    <label>応募日</label>
    <input id="editAppliedDate" type="date">


    <label>求人URL</label>
    <input id="editJobUrl" type="url">


    <label>メモ</label>
    <textarea id="editMemo"></textarea>


    <button id="saveCompanyButton">
      保存する
    </button>

  </div>

</section>



<!-- =====================
     企業登録
===================== -->

<section id="addCompanyPage" class="page">

  <div class="section-title">
    企業を登録
  </div>

  <div class="card">

    <label>企業名</label>

    <input
      id="companyName"
      type="text"
      placeholder="例：株式会社〇〇"
    >


    <label>職種</label>

    <input
      id="jobType"
      type="text"
      placeholder="例：キャリアアドバイザー"
    >


    <label>ステータス</label>

    <select id="status">

      <option value="応募">応募</option>
      <option value="書類選考">書類選考</option>
      <option value="一次面接">一次面接</option>
      <option value="二次面接">二次面接</option>
      <option value="最終面接">最終面接</option>
      <option value="面接結果待ち">面接結果待ち</option>
      <option value="内定">内定</option>
      <option value="不合格">不合格</option>
      <option value="辞退">辞退</option>

    </select>


    <label>求人媒体</label>

    <input
      id="media"
      type="text"
      placeholder="例：doda"
    >


    <label>応募日</label>

    <input
      id="appliedDate"
      type="date"
    >


    <label>求人URL</label>

    <input
      id="jobUrl"
      type="url"
      placeholder="https://..."
    >


    <label>メモ</label>

    <textarea
      id="memo"
      placeholder="面接で確認したいことなど">
    </textarea>


    <button id="addCompanyButton">
      企業を登録
    </button>

  </div>

</section>



<!-- =====================
     面接登録
===================== -->

<section id="addInterviewPage" class="page">

  <div class="section-title">
    面接を登録
  </div>

  <div class="card">

    <label>企業</label>

    <select id="interviewCompany"></select>


    <label>面接回数</label>

    <select id="interviewRound">

      <option value="一次面接">一次面接</option>
      <option value="二次面接">二次面接</option>
      <option value="最終面接">最終面接</option>

    </select>


    <label>面接日</label>

    <input
      id="interviewDate"
      type="date"
    >


    <label>面接時間</label>

    <input
      id="interviewTime"
      type="time"
    >


    <label>WEB面接URL</label>

    <input
      id="interviewUrl"
      type="url"
      placeholder="https://..."
    >


    <button id="addInterviewButton">
      面接を登録
    </button>

  </div>

</section>



<!-- =====================
     面接編集
===================== -->

<section id="editInterviewPage" class="page">

  <button
    class="back-button"
    onclick="showPage('companyDetailPage')">
    ← 企業詳細に戻る
  </button>

  <div class="section-title">
    面接を編集
  </div>

  <div class="card">

    <label>企業</label>

    <select id="editInterviewCompany"></select>


    <label>面接回数</label>

    <select id="editInterviewRound">

      <option value="一次面接">一次面接</option>
      <option value="二次面接">二次面接</option>
      <option value="最終面接">最終面接</option>

    </select>


    <label>面接日</label>

    <input
      id="editInterviewDate"
      type="date"
    >


    <label>面接時間</label>

    <input
      id="editInterviewTime"
      type="time"
    >


    <label>WEB面接URL</label>

    <input
      id="editInterviewUrl"
      type="url"
    >


    <button id="saveInterviewButton">
      保存する
    </button>

  </div>

</section>


</div>



<!-- =====================
     下部ナビ
===================== -->

<nav class="bottom-nav">

  <button id="navHome" class="active">
    ホーム
  </button>

  <button id="navCompanies">
    企業一覧
  </button>

  <button id="navAddCompany">
    ＋企業
  </button>

  <button id="navAddInterview">
    ＋面接
  </button>

</nav>



<script>


/* =====================
   データ読み込み
===================== */

let companies =
JSON.parse(
  localStorage.getItem("companies") || "[]"
);


let interviews =
JSON.parse(
  localStorage.getItem("interviews") || "[]"
);


let selectedCompanyName = null;

let editingCompanyName = null;

let editingInterviewIndex = null;



/* =====================
   ページ切り替え
===================== */

function showPage(pageId) {


  document
    .querySelectorAll(".page")
    .forEach(function(page) {

      page.classList.remove("active");

    });


  const page =
    document.getElementById(pageId);


  if (page) {

    page.classList.add("active");

  }


  document
    .querySelectorAll(".bottom-nav button")
    .forEach(function(button) {

      button.classList.remove("active");

    });


  if (pageId === "homePage") {

    document
      .getElementById("navHome")
      .classList.add("active");

    renderHome();

  }


  if (pageId === "companiesPage") {

    document
      .getElementById("navCompanies")
      .classList.add("active");

    displayCompanies();

  }


  if (pageId === "addCompanyPage") {

    document
      .getElementById("navAddCompany")
      .classList.add("active");

  }


  if (pageId === "addInterviewPage") {

    document
      .getElementById("navAddInterview")
      .classList.add("active");

    updateCompanySelect();

  }

}



/* =====================
   ナビ
===================== */

document
  .getElementById("navHome")
  .addEventListener("click", function() {

    showPage("homePage");

  });


document
  .getElementById("navCompanies")
  .addEventListener("click", function() {

    showPage("companiesPage");

  });


document
  .getElementById("navAddCompany")
  .addEventListener("click", function() {

    showPage("addCompanyPage");

  });


document
  .getElementById("navAddInterview")
  .addEventListener("click", function() {

    showPage("addInterviewPage");

  });



/* =====================
   企業登録
===================== */

document
  .getElementById("addCompanyButton")
  .addEventListener("click", function() {


    const name =
      document
        .getElementById("companyName")
        .value
        .trim();


    const jobType =
      document
        .getElementById("jobType")
        .value
        .trim();


    const status =
      document
        .getElementById("status")
        .value;


    const media =
      document
        .getElementById("media")
        .value
        .trim();


    const appliedDate =
      document
        .getElementById("appliedDate")
        .value;


    const jobUrl =
      document
        .getElementById("jobUrl")
        .value
        .trim();


    const memo =
      document
        .getElementById("memo")
        .value
        .trim();


    if (name === "") {

      alert("企業名を入力してください");

      return;

    }


    companies.push({

      name: name,

      jobType: jobType,

      status: status,

      media: media,

      appliedDate: appliedDate,

      jobUrl: jobUrl,

      memo: memo

    });


    saveCompanies();


    document
      .getElementById("companyName")
      .value = "";

    document
      .getElementById("jobType")
      .value = "";

    document
      .getElementById("media")
      .value = "";

    document
      .getElementById("appliedDate")
      .value = "";

    document
      .getElementById("jobUrl")
      .value = "";

    document
      .getElementById("memo")
      .value = "";


    updateCompanySelect();

    alert("企業を登録しました");

    showPage("companiesPage");

  });



/* =====================
   企業データ保存
===================== */

function saveCompanies() {

  localStorage.setItem(
    "companies",
    JSON.stringify(companies)
  );

}



/* =====================
   面接データ保存
===================== */

function saveInterviews() {

  localStorage.setItem(
    "interviews",
    JSON.stringify(interviews)
  );

}



/* =====================
   企業選択欄
===================== */

function updateCompanySelect() {


  const selects = [

    document.getElementById("interviewCompany"),

    document.getElementById("editInterviewCompany")

  ];


  selects.forEach(function(select) {


    if (!select) return;


    const currentValue =
      select.value;


    select.innerHTML = "";


    if (companies.length === 0) {

      const option =
        document.createElement("option");

      option.value = "";

      option.textContent =
        "先に企業を登録してください";

      select.appendChild(option);

      return;

    }


    companies.forEach(function(company) {

      const option =
        document.createElement("option");

      option.value =
        company.name;

      option.textContent =
        company.name;

      select.appendChild(option);

    });


    if (
      companies.some(function(company) {
        return company.name === currentValue;
      })
    ) {

      select.value = currentValue;

    }

  });

}



/* =====================
   企業一覧表示
===================== */

function displayCompanies() {


  const list =
    document
      .getElementById("companyList");


  list.innerHTML = "";


  const keyword =
    document
      .getElementById("searchCompany")
      .value
      .trim()
      .toLowerCase();


  const filterStatus =
    document
      .getElementById("filterStatus")
      .value;


  const filtered =
    companies.filter(function(company) {


      const name =
        (company.name || "")
          .toLowerCase();


      const matchesName =
        name.includes(keyword);


      const matchesStatus =
        filterStatus === "" ||
        company.status === filterStatus;


      return (
        matchesName &&
        matchesStatus
      );

    });


  if (filtered.length === 0) {

    list.innerHTML =
      '<div class="empty">該当する企業がありません</div>';

    return;

  }


  filtered.forEach(function(company) {


    const div =
      document.createElement("div");


    div.className =
      "company";


    div.innerHTML =

      '<div class="company-name">' +
      escapeHtml(company.name || "企業名未登録") +
      '</div>' +

      '<div class="meta">' +
      '職種：' +
      escapeHtml(company.jobType || "未登録") +
      '</div>' +

      '<div class="meta">' +
      '求人媒体：' +
      escapeHtml(company.media || "未登録") +
      '</div>' +

      '<span class="status">' +
      escapeHtml(company.status || "未登録") +
      '</span>';


    div.addEventListener(
      "click",
      function() {

        showCompanyDetail(
          company.name
        );

      }
    );


    list.appendChild(div);

  });

}



/* =====================
   検索・絞り込み
===================== */

document
  .getElementById("searchCompany")
  .addEventListener(
    "input",
    displayCompanies
  );


document
  .getElementById("filterStatus")
  .addEventListener(
    "change",
    displayCompanies
  );


document
  .getElementById("clearFilters")
  .addEventListener(
    "click",
    function() {

      document
        .getElementById("searchCompany")
        .value = "";

      document
        .getElementById("filterStatus")
        .value = "";

      displayCompanies();

    }
  );



/* =====================
   企業詳細
===================== */

function showCompanyDetail(companyName) {


  const company =
    companies.find(function(item) {

      return item.name === companyName;

    });


  if (!company) {

    alert("企業情報が見つかりません");

    return;

  }


  selectedCompanyName =
    companyName;


  document
    .getElementById("detailCompanyName")
    .textContent =
      company.name || "企業名未登録";


  document
    .getElementById("detailJobType")
    .textContent =
      company.jobType || "未登録";


  document
    .getElementById("detailStatus")
    .textContent =
      company.status || "未登録";


  document
    .getElementById("detailMedia")
    .textContent =
      company.media || "未登録";


  document
    .getElementById("detailAppliedDate")
    .textContent =
      company.appliedDate || "未登録";


  const jobUrl =
    document
      .getElementById("detailJobUrl");


  jobUrl.innerHTML = "";


  if (company.jobUrl) {

    const link =
      document.createElement("a");

    link.href =
      company.jobUrl;

    link.target =
      "_blank";

    link.rel =
      "noopener noreferrer";

    link.className =
      "detail-link";

    link.textContent =
      company.jobUrl;

    jobUrl.appendChild(link);

  } else {

    jobUrl.textContent =
      "未登録";

  }


  document
    .getElementById("detailMemo")
    .textContent =
      company.memo || "メモなし";


  renderCompanyInterviews(companyName);


  showPage("companyDetailPage");

}



/* =====================
   企業の面接表示
===================== */

function renderCompanyInterviews(companyName) {


  const area =
    document
      .getElementById("detailInterviews");


  area.innerHTML = "";


  const companyInterviews =
    interviews
      .map(function(interview, index) {

        return {
          interview: interview,
          index: index
        };

      })
      .filter(function(item) {

        return (
          item.interview.companyName ===
          companyName
        );

      })
      .sort(function(a, b) {

        return (
          (a.interview.date || "") +
          (a.interview.time || "")
        ).localeCompare(
          (b.interview.date || "") +
          (b.interview.time || "")
        );

      });


  if (companyInterviews.length === 0) {

    area.innerHTML =
      '<div class="card empty">面接予定はありません</div>';

    return;

  }


  companyInterviews.forEach(function(item) {


    const div =
      createInterviewCard(
        item.interview,
        item.index
      );


    area.appendChild(div);

  });

}



/* =====================
   面接カード
===================== */

function createInterviewCard(
  interview,
  index
) {


  const div =
    document.createElement("div");


  div.className =
    "interview";


  const companyName =
    interview.companyName ||
    "企業名未登録";


  div.innerHTML =

    '<div class="interview-company">' +
    escapeHtml(companyName) +
    '</div>' +

    '<div class="interview-date">' +
    escapeHtml(interview.date || "日付未登録") +
    ' ' +
    escapeHtml(interview.time || "") +
    '</div>' +

    '<div class="interview-round">' +
    escapeHtml(interview.round || "面接") +
    '</div>';


  if (interview.url) {


    const link =
      document.createElement("a");


    link.className =
      "web-button";


    link.href =
      interview.url;


    link.target =
      "_blank";


    link.rel =
      "noopener noreferrer";


    link.textContent =
      "WEB面接を開く";


    div.appendChild(link);

  }


  const actions =
    document.createElement("div");


  actions.className =
    "action-row";


  const editButton =
    document.createElement("button");


  editButton.textContent =
    "編集";


  editButton.addEventListener(
    "click",
    function() {

      editInterview(index);

    }
  );


  const deleteButton =
    document.createElement("button");


  deleteButton.textContent =
    "削除";


  deleteButton.className =
    "danger";


  deleteButton.addEventListener(
    "click",
    function() {

      deleteInterview(index);

    }
  );


  actions.appendChild(
    editButton
  );


  actions.appendChild(
    deleteButton
  );


  div.appendChild(actions);


  return div;

}

/* =====================
   企業編集保存
===================== */

document
  .getElementById("saveCompanyButton")
  .addEventListener(
    "click",
    function() {


      const company =
        companies.find(function(item) {

          return (
            item.name ===
            editingCompanyName
          );

        });


      if (!company) {

        alert("企業情報が見つかりません");

        return;

      }


      const newName =
        document
          .getElementById("editCompanyName")
          .value
          .trim();


      if (newName === "") {

        alert("企業名を入力してください");

        return;

      }


      const duplicate =
        companies.some(function(item) {

          return (
            item !== company &&
            item.name === newName
          );

        });


      if (duplicate) {

        alert("同じ企業名がすでに登録されています");

        return;

      }


      const oldName =
        company.name;


      company.name =
        newName;


      company.jobType =
        document
          .getElementById("editJobType")
          .value
          .trim();


      company.status =
        document
          .getElementById("editStatus")
          .value;


      company.media =
        document
          .getElementById("editMedia")
          .value
          .trim();


      company.appliedDate =
        document
          .getElementById("editAppliedDate")
          .value;


      company.jobUrl =
        document
          .getElementById("editJobUrl")
          .value
          .trim();


      company.memo =
        document
          .getElementById("editMemo")
          .value
          .trim();


      interviews.forEach(
        function(interview) {

          if (
            interview.companyName ===
            oldName
          ) {

            interview.companyName =
              newName;

          }

        }
      );


      saveCompanies();

      saveInterviews();


      selectedCompanyName =
        newName;


      editingCompanyName =
        newName;


      alert("企業情報を更新しました");


      showCompanyDetail(newName);

    }
  );



/* =====================
   企業削除
===================== */

document
  .getElementById("deleteCompanyButton")
  .addEventListener(
    "click",
    function() {


      if (!selectedCompanyName) {

        return;

      }


      const company =
        companies.find(function(item) {

          return (
            item.name ===
            selectedCompanyName
          );

        });


      if (!company) {

        alert("企業情報が見つかりません");

        return;

      }


      const relatedInterviews =
        interviews.filter(function(interview) {

          return (
            interview.companyName ===
            selectedCompanyName
          );

        });


      let message =
        "「" +
        selectedCompanyName +
        "」を削除しますか？";


      if (relatedInterviews.length > 0) {

        message +=
          "\n\nこの企業の面接予定も " +
          relatedInterviews.length +
          "件あります。";

      }


      if (
        !confirm(message)
      ) {

        return;

      }


      companies =
        companies.filter(function(item) {

          return (
            item.name !==
            selectedCompanyName
          );

        });


      interviews =
        interviews.filter(function(interview) {

          return (
            interview.companyName !==
            selectedCompanyName
          );

        });


      saveCompanies();

      saveInterviews();


      selectedCompanyName =
        null;


      alert("削除しました");


      showPage("companiesPage");

    }
  );

/* =====================
   面接削除
===================== */

function deleteInterview(index) {


  const interview =
    interviews[index];


  if (!interview) {

    alert("面接情報が見つかりません");

    return;

  }


  const companyName =
    interview.companyName ||
    "企業名未登録";


  if (
    !confirm(
      companyName +
      "\n" +
      (interview.date || "") +
      " " +
      (interview.time || "") +
      "\n\nこの面接を削除しますか？"
    )
  ) {

    return;

  }


  interviews.splice(
    index,
    1
  );


  saveInterviews();


  alert("面接を削除しました");


  if (selectedCompanyName) {

    showCompanyDetail(
      selectedCompanyName
    );

  } else {

    renderHome();

  }

}



/* =====================
   ホーム
===================== */

function renderHome() {


  const now =
    new Date();


  document
    .getElementById("todayText")
    .textContent =
      now.toLocaleDateString(
        "ja-JP",
        {
          year: "numeric",
          month: "long",
          day: "numeric",
          weekday: "short"
        }
      );


  const year =
    now.getFullYear();


  const month =
    String(
      now.getMonth() + 1
    ).padStart(2, "0");


  const day =
    String(
      now.getDate()
    ).padStart(2, "0");


  const today =
    year +
    "-" +
    month +
    "-" +
    day;


  const todayArea =
    document
      .getElementById("todayInterviews");


  const upcomingArea =
    document
      .getElementById("upcomingInterviews");


  todayArea.innerHTML = "";

  upcomingArea.innerHTML = "";


  const todayList =
    interviews
      .filter(function(interview) {

        return (
          interview.date ===
          today
        );

      })
      .sort(function(a, b) {

        return (
          (a.time || "")
            .localeCompare(
              b.time || ""
            )
        );

      });


  const upcomingList =
    interviews
      .filter(function(interview) {

        return (
          interview.date &&
          interview.date > today
        );

      })
      .sort(function(a, b) {

        return (
          (a.date || "") +
          (a.time || "")
        ).localeCompare(
          (b.date || "") +
          (b.time || "")
        );

      });


  if (
    todayList.length === 0
  ) {

    todayArea.innerHTML =
      '<div class="card empty">今日の面接はありません</div>';

  } else {

    todayList.forEach(
      function(interview) {

        todayArea.appendChild(
          createInterviewCard(
            interview,
            interviews.indexOf(
              interview
            )
          )
        );

      }
    );

  }


  if (
    upcomingList.length === 0
  ) {

    upcomingArea.innerHTML =
      '<div class="card empty">今後の面接はありません</div>';

  } else {

    upcomingList
      .slice(0, 5)
      .forEach(
        function(interview) {

          upcomingArea.appendChild(
            createInterviewCard(
              interview,
              interviews.indexOf(
                interview
              )
            )
          );

        }
      );

  }


  document
    .getElementById("selectionCount")
    .textContent =
      companies.filter(function(company) {

        return (
          company.status === "応募" ||
          company.status === "書類選考"
        );

      }).length;


  document
    .getElementById("interviewCount")
    .textContent =
      companies.filter(function(company) {

        return (
          company.status === "一次面接" ||
          company.status === "二次面接" ||
          company.status === "最終面接"
        );

      }).length;


  document
    .getElementById("waitingCount")
    .textContent =
      companies.filter(function(company) {

        return (
          company.status ===
          "面接結果待ち"
        );

      }).length;


  document
    .getElementById("offerCount")
    .textContent =
      companies.filter(function(company) {

        return (
          company.status ===
          "内定"
        );

      }).length;


  document
    .getElementById("rejectedCount")
    .textContent =
      companies.filter(function(company) {

        return (
          company.status ===
          "不合格"
        );

      }).length;


  document
    .getElementById("withdrawnCount")
    .textContent =
      companies.filter(function(company) {

        return (
          company.status ===
          "辞退"
        );

      }).length;

}



/* =====================
   HTMLエスケープ
===================== */

function escapeHtml(value) {


  const div =
    document.createElement("div");


  div.textContent =
    String(value);


  return div.innerHTML;

}
